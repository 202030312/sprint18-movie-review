# Render Blueprint: FastAPI 백엔드 (무료 플랜)
services:
  - type: web
    name: movie-review-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AUTO_SEED
        value: "1"
      - key: TZ
        value: Asia/Seoul
